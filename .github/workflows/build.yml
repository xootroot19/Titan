name: Titan Engine Android ARMv7

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

env:
  API: "24"
  COMPILE_SDK: "35"
  BUILD_TOOLS: "35.0.0"
  NDK_VERSION: "27.2.12479018"
  RAYLIB_VERSION: "5.5"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euxo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-${COMPILE_SDK}" \
            "build-tools;${BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}"

          NDK_PATH="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"
          test -d "$NDK_PATH"

          echo "NDK=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Verify ARMv7 toolchain
        shell: bash
        run: |
          set -euxo pipefail

          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          CC="$TOOLCHAIN/bin/armv7a-linux-androideabi${API}-clang"

          test -x "$CC"
          "$CC" --version

      # ============================================================
      # ENGINE SOURCE
      # ============================================================

      - name: Generate Titan Engine
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p game

          cat > game/main.c <<'EOF'
          #include "raylib.h"
          #include "raymath.h"

          #include <math.h>
          #include <stdbool.h>

          typedef struct
          {
              Vector3 position;
              Vector3 velocity;
              float radius;
              bool grounded;
          } Body;

          static float SafeDT(float dt)
          {
              if (dt > 0.033333f)
                  dt = 0.033333f;

              return dt;
          }

          static void PhysicsStep(Body *b, float dt)
          {
              b->velocity.y -= 24.0f * dt;

              b->position.x += b->velocity.x * dt;
              b->position.y += b->velocity.y * dt;
              b->position.z += b->velocity.z * dt;

              b->grounded = false;

              if (b->position.y < b->radius)
              {
                  b->position.y = b->radius;

                  if (b->velocity.y < 0.0f)
                      b->velocity.y *= -0.12f;

                  if (fabsf(b->velocity.y) < 0.5f)
                      b->velocity.y = 0.0f;

                  b->velocity.x *= 0.88f;
                  b->velocity.z *= 0.88f;

                  b->grounded = true;
              }
          }

          static void DrawRuin(Vector3 p, Vector3 size)
          {
              Color stone = {100, 103, 92, 255};

              DrawCubeV(p, size, stone);
              DrawCubeWiresV(
                  p,
                  size,
                  Fade(BLACK, 0.18f)
              );
          }

          static void DrawTitan(Vector3 p, float t)
          {
              Color body = {72, 75, 65, 255};
              Color dark = {51, 55, 49, 255};

              float breathing =
                  sinf(t * 1.1f) * 0.18f;

              // legs
              DrawCube(
                  (Vector3){p.x - 2.5f, p.y + 4, p.z},
                  2.8f, 8.0f, 3.0f,
                  dark
              );

              DrawCube(
                  (Vector3){p.x + 2.5f, p.y + 4, p.z},
                  2.8f, 8.0f, 3.0f,
                  dark
              );

              // body
              DrawCube(
                  (Vector3){
                      p.x,
                      p.y + 10 + breathing,
                      p.z
                  },
                  8.0f,
                  9.0f,
                  5.0f,
                  body
              );

              // shoulders
              DrawSphere(
                  (Vector3){p.x - 5, p.y + 12, p.z},
                  2.2f,
                  body
              );

              DrawSphere(
                  (Vector3){p.x + 5, p.y + 12, p.z},
                  2.2f,
                  body
              );

              // arms
              DrawCube(
                  (Vector3){p.x - 6, p.y + 7, p.z},
                  2.4f, 10, 2.4f,
                  dark
              );

              DrawCube(
                  (Vector3){p.x + 6, p.y + 7, p.z},
                  2.4f, 10, 2.4f,
                  dark
              );

              // head
              DrawSphere(
                  (Vector3){
                      p.x,
                      p.y + 16 + breathing,
                      p.z
                  },
                  2.8f,
                  dark
              );

              // eyes
              DrawSphere(
                  (Vector3){
                      p.x - 0.9f,
                      p.y + 16.3f + breathing,
                      p.z + 2.4f
                  },
                  0.22f,
                  GOLD
              );

              DrawSphere(
                  (Vector3){
                      p.x + 0.9f,
                      p.y + 16.3f + breathing,
                      p.z + 2.4f
                  },
                  0.22f,
                  GOLD
              );
          }

          int main(void)
          {
              SetConfigFlags(
                  FLAG_MSAA_4X_HINT |
                  FLAG_VSYNC_HINT
              );

              InitWindow(
                  1280,
                  720,
                  "Titan Mobile Engine"
              );

              SetTargetFPS(60);

              Body player = {
                  {0, 0.6f, 12},
                  {0, 0, 0},
                  0.55f,
                  false
              };

              #define ROCKS 48

              Body debris[ROCKS];

              for (int i = 0; i < ROCKS; i++)
              {
                  debris[i].position = (Vector3){
                      ((i % 8) - 4) * 1.1f,
                      1.0f + (i / 8),
                      -7
                  };

                  debris[i].velocity =
                      (Vector3){0, 0, 0};

                  debris[i].radius = 0.35f;
                  debris[i].grounded = false;
              }

              Camera3D camera = {0};

              camera.position =
                  (Vector3){10, 7, 18};

              camera.target =
                  (Vector3){0, 2, 0};

              camera.up =
                  (Vector3){0, 1, 0};

              camera.fovy = 65;
              camera.projection =
                  CAMERA_PERSPECTIVE;

              float time = 0;

              while (!WindowShouldClose())
              {
                  float dt =
                      SafeDT(GetFrameTime());

                  time += dt;

                  Vector3 forward = {
                      camera.target.x -
                          camera.position.x,

                      0,

                      camera.target.z -
                          camera.position.z
                  };

                  if (Vector3Length(forward) > 0.01f)
                      forward =
                          Vector3Normalize(forward);

                  Vector3 right = {
                      -forward.z,
                      0,
                      forward.x
                  };

                  Vector3 move = {0};

                  if (IsKeyDown(KEY_W))
                      move =
                          Vector3Add(move, forward);

                  if (IsKeyDown(KEY_S))
                      move =
                          Vector3Subtract(move, forward);

                  if (IsKeyDown(KEY_D))
                      move =
                          Vector3Add(move, right);

                  if (IsKeyDown(KEY_A))
                      move =
                          Vector3Subtract(move, right);

                  if (Vector3Length(move) > 0.01f)
                  {
                      move =
                          Vector3Normalize(move);

                      player.velocity.x =
                          move.x * 7;

                      player.velocity.z =
                          move.z * 7;
                  }
                  else
                  {
                      player.velocity.x *= 0.82f;
                      player.velocity.z *= 0.82f;
                  }

                  if (
                      IsKeyPressed(KEY_SPACE) &&
                      player.grounded
                  )
                  {
                      player.velocity.y = 9;
                  }

                  PhysicsStep(&player, dt);

                  for (int i = 0; i < ROCKS; i++)
                      PhysicsStep(
                          &debris[i],
                          dt
                      );

                  Vector3 target = {
                      player.position.x,
                      player.position.y + 1.5f,
                      player.position.z
                  };

                  Vector3 desired = {
                      player.position.x + 10,
                      player.position.y + 7,
                      player.position.z + 15
                  };

                  camera.target =
                      Vector3Lerp(
                          camera.target,
                          target,
                          dt * 6
                      );

                  camera.position =
                      Vector3Lerp(
                          camera.position,
                          desired,
                          dt * 4
                      );

                  BeginDrawing();

                  ClearBackground(
                      (Color){181, 190, 184, 255}
                  );

                  BeginMode3D(camera);

                  DrawPlane(
                      (Vector3){0, 0, 0},
                      (Vector2){150, 150},
                      (Color){113, 118, 97, 255}
                  );

                  // monumental ruins
                  for (int i = -7; i <= 7; i++)
                  {
                      float h =
                          4 + ((i * i) % 5);

                      DrawRuin(
                          (Vector3){
                              i * 4.0f,
                              h * 0.5f,
                              -17
                          },
                          (Vector3){
                              1.7f,
                              h,
                              1.7f
                          }
                      );
                  }

                  DrawRuin(
                      (Vector3){-15, 5, -21},
                      (Vector3){10, 10, 3}
                  );

                  DrawRuin(
                      (Vector3){15, 4, -21},
                      (Vector3){9, 8, 3}
                  );

                  DrawTitan(
                      (Vector3){0, 0, -34},
                      time
                  );

                  DrawCapsule(
                      player.position,

                      (Vector3){
                          player.position.x,
                          player.position.y + 1.7f,
                          player.position.z
                      },

                      0.45f,
                      8,
                      8,
                      (Color){31, 36, 37, 255}
                  );

                  for (int i = 0; i < ROCKS; i++)
                  {
                      DrawCube(
                          debris[i].position,
                          0.7f,
                          0.7f,
                          0.7f,
                          (Color){96, 95, 82, 255}
                      );
                  }

                  EndMode3D();

                  DrawRectangle(
                      14,
                      14,
                      430,
                      125,
                      Fade(BLACK, 0.60f)
                  );

                  DrawText(
                      "TITAN MOBILE ENGINE",
                      27,
                      25,
                      25,
                      RAYWHITE
                  );

                  DrawText(
                      "ARMv7 32-bit / GLES2",
                      27,
                      58,
                      18,
                      LIGHTGRAY
                  );

                  DrawText(
                      "RigidBody: ON",
                      27,
                      82,
                      17,
                      LIGHTGRAY
                  );

                  DrawText(
                      "Colossus AI: TEST",
                      27,
                      104,
                      17,
                      LIGHTGRAY
                  );

                  DrawFPS(330, 104);

                  EndDrawing();
              }

              CloseWindow();

              return 0;
          }
          EOF

      # ============================================================
      # RAYLIB
      # ============================================================

      - name: Download raylib
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth 1 \
            --branch "${RAYLIB_VERSION}" \
            https://github.com/raysan5/raylib.git

      - name: Build raylib ARMv7
        shell: bash
        run: |
          set -euxo pipefail

          cd raylib/src

          make clean || true

          make \
            PLATFORM=PLATFORM_ANDROID \
            ANDROID_ARCH=arm \
            ANDROID_API_VERSION=${API} \
            ANDROID_NDK=${NDK} \
            GRAPHICS=GRAPHICS_API_OPENGL_ES2 \
            RAYLIB_LIBTYPE=STATIC

      # ============================================================
      # COMPILE ENGINE
      # ============================================================

      - name: Compile Titan ARMv7
        shell: bash
        run: |
          set -euxo pipefail

          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          CC="$TOOLCHAIN/bin/armv7a-linux-androideabi${API}-clang"

          mkdir -p apk/lib/armeabi-v7a

          "$CC" \
            game/main.c \
            -shared \
            -fPIC \
            -O2 \
            -ffunction-sections \
            -fdata-sections \
            -march=armv7-a \
            -DPLATFORM_ANDROID \
            -Iraylib/src \
            -Iraylib/src/external/glfw/include \
            -Lraylib/src \
            -lraylib \
            -Wl,--gc-sections \
            -Wl,-soname,libmain.so \
            -landroid \
            -llog \
            -lEGL \
            -lGLESv2 \
            -lOpenSLES \
            -lm \
            -ldl \
            -u ANativeActivity_onCreate \
            -o apk/lib/armeabi-v7a/libmain.so

      # ============================================================
      # VERIFY REAL 32-BIT ARM
      # ============================================================

      - name: Verify ARM 32-bit binary
        shell: bash
        run: |
          set -euxo pipefail

          LIB="apk/lib/armeabi-v7a/libmain.so"

          test -s "$LIB"

          file "$LIB"
          readelf -h "$LIB"

          file "$LIB" | grep "ELF 32-bit"
          file "$LIB" | grep "ARM"

          echo "ARMv7 32-bit OK"

      # ============================================================
      # MANIFEST - CORRIGIDO
      # ============================================================

      - name: Generate Android package
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p apk/res/values
          mkdir -p apk/assets

          cat > apk/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Titan Mobile Engine</string>
          </resources>
          EOF

          cat > apk/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.titanmobile.engine">

              <uses-sdk
                  android:minSdkVersion="24"
                  android:targetSdkVersion="35" />

              <uses-feature
                  android:glEsVersion="0x00020000"
                  android:required="true" />

              <application
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen"
                  android:hasCode="false"
                  android:allowBackup="false">

                  <activity
                      android:name="android.app.NativeActivity"
                      android:label="@string/app_name"
                      android:screenOrientation="landscape"
                      android:configChanges="orientation|keyboardHidden|screenSize"
                      android:exported="true">

                      <meta-data
                          android:name="android.app.lib_name"
                          android:value="main" />

                      <intent-filter>
                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          echo "======= MANIFEST ======="
          cat apk/AndroidManifest.xml

      # ============================================================
      # CREATE APK
      # ============================================================

      - name: Build APK
        shell: bash
        run: |
          set -euxo pipefail

          BT="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}"

          ANDROID_JAR="$ANDROID_SDK_ROOT/platforms/android-${COMPILE_SDK}/android.jar"

          mkdir -p out

          "$BT/aapt" package \
            -f \
            -M apk/AndroidManifest.xml \
            -S apk/res \
            -A apk/assets \
            -I "$ANDROID_JAR" \
            -F out/Titan-unsigned.apk

          (
            cd apk

            "$BT/aapt" add \
              ../out/Titan-unsigned.apk \
              lib/armeabi-v7a/libmain.so
          )

          unzip -l \
            out/Titan-unsigned.apk \
            | grep "lib/armeabi-v7a/libmain.so"

      # ============================================================
      # ALIGN
      # ============================================================

      - name: Zipalign
        shell: bash
        run: |
          set -euxo pipefail

          BT="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}"

          "$BT/zipalign" \
            -f \
            -p \
            4 \
            out/Titan-unsigned.apk \
            out/Titan-aligned.apk

          "$BT/zipalign" \
            -c \
            -v \
            4 \
            out/Titan-aligned.apk

      # ============================================================
      # DEBUG SIGNING KEY
      # ============================================================

      - name: Generate signing key
        shell: bash
        run: |
          set -euxo pipefail

          keytool \
            -genkeypair \
            -noprompt \
            -keystore titan.keystore \
            -storepass android \
            -keypass android \
            -alias titan \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Titan Mobile Engine,O=Titan,C=BR"

      # ============================================================
      # SIGN
      # ============================================================

      - name: Sign APK
        shell: bash
        run: |
          set -euxo pipefail

          BT="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}"

          "$BT/apksigner" sign \
            --ks titan.keystore \
            --ks-key-alias titan \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out out/TitanEngine-ARMv7.apk \
            out/Titan-aligned.apk

      # ============================================================
      # FINAL CHECK
      # ============================================================

      - name: Validate final APK
        shell: bash
        run: |
          set -euxo pipefail

          APK="out/TitanEngine-ARMv7.apk"

          BT="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}"

          test -s "$APK"

          "$BT/apksigner" verify \
            --verbose \
            --print-certs \
            "$APK"

          unzip -l "$APK" \
            | grep "lib/armeabi-v7a/libmain.so"

          echo ""
          echo "======================================"
          echo " TITAN MOBILE ENGINE"
          echo " APK GENERATED"
          echo " ABI: armeabi-v7a"
          echo " ARCH: ARMv7"
          echo " BITS: 32"
          echo "======================================"

          ls -lh "$APK"

      # ============================================================
      # DOWNLOADABLE ARTIFACT
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TitanEngine-ARMv7-32bit
          path: out/TitanEngine-ARMv7.apk
          if-no-files-found: error
          retention-days: 30
