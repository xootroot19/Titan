name: Titan Engine - Android 32bit

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

env:
  API: "24"
  BUILD_TOOLS: "35.0.0"
  RAYLIB_VERSION: "5.5"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;${BUILD_TOOLS}" \
            "ndk;27.2.12479018"

      - name: Generate Titan source
        shell: bash
        run: |
          mkdir -p game

          cat > game/main.c <<'EOF'
          #include "raylib.h"
          #include "raymath.h"
          #include <math.h>

          typedef struct {
              Vector3 pos;
              Vector3 vel;
              float radius;
          } Body;

          static void GroundPhysics(Body *b, float dt)
          {
              b->vel.y -= 24.0f*dt;
              b->pos = Vector3Add(b->pos,
                      Vector3Scale(b->vel,dt));

              if (b->pos.y < b->radius)
              {
                  b->pos.y = b->radius;

                  if (b->vel.y < 0)
                      b->vel.y *= -0.28f;

                  b->vel.x *= 0.93f;
                  b->vel.z *= 0.93f;
              }
          }

          int main(void)
          {
              SetConfigFlags(FLAG_MSAA_4X_HINT);
              InitWindow(1280,720,"Titan Mobile Engine");

              Camera3D cam = {0};
              cam.position = (Vector3){ 8,6,12 };
              cam.target = (Vector3){0,2,0};
              cam.up = (Vector3){0,1,0};
              cam.fovy = 65;
              cam.projection = CAMERA_PERSPECTIVE;

              Body player = {
                  {0,1,8},
                  {0,0,0},
                  0.55f
              };

              Body rocks[32];

              for(int i=0;i<32;i++)
              {
                  rocks[i].pos=(Vector3){
                      (float)(i%8)-4,
                      3.0f+(float)(i/8)*1.2f,
                      -2.0f
                  };

                  rocks[i].vel=(Vector3){0,0,0};
                  rocks[i].radius=0.32f;
              }

              SetTargetFPS(60);

              while(!WindowShouldClose())
              {
                  float dt=GetFrameTime();
                  if(dt>0.033f) dt=0.033f;

                  Vector3 forward =
                      Vector3Normalize(
                          (Vector3){
                              cam.target.x-cam.position.x,
                              0,
                              cam.target.z-cam.position.z
                          });

                  Vector3 right =
                      (Vector3){-forward.z,0,forward.x};

                  Vector3 move={0};

                  if(IsKeyDown(KEY_W))
                      move=Vector3Add(move,forward);
                  if(IsKeyDown(KEY_S))
                      move=Vector3Subtract(move,forward);
                  if(IsKeyDown(KEY_D))
                      move=Vector3Add(move,right);
                  if(IsKeyDown(KEY_A))
                      move=Vector3Subtract(move,right);

                  if(Vector3Length(move)>0.01f)
                  {
                      move=Vector3Normalize(move);
                      player.vel.x=move.x*7;
                      player.vel.z=move.z*7;
                  }
                  else
                  {
                      player.vel.x*=0.84f;
                      player.vel.z*=0.84f;
                  }

                  if(IsKeyPressed(KEY_SPACE) &&
                     player.pos.y<0.61f)
                      player.vel.y=9.5f;

                  GroundPhysics(&player,dt);

                  for(int i=0;i<32;i++)
                      GroundPhysics(&rocks[i],dt);

                  cam.target =
                      Vector3Lerp(
                          cam.target,
                          (Vector3){
                              player.pos.x,
                              player.pos.y+1.2f,
                              player.pos.z
                          },
                          5*dt);

                  cam.position =
                      Vector3Lerp(
                          cam.position,
                          (Vector3){
                              player.pos.x+8,
                              player.pos.y+6,
                              player.pos.z+12
                          },
                          3*dt);

                  BeginDrawing();
                  ClearBackground((Color){165,184,188,255});

                  BeginMode3D(cam);

                  DrawPlane(
                      (Vector3){0,0,0},
                      (Vector2){120,120},
                      (Color){92,109,83,255});

                  // Ruinas
                  for(int i=-5;i<=5;i++)
                  {
                      DrawCube(
                          (Vector3){i*3.5f,2,-8},
                          1.2f,4,1.2f,
                          (Color){100,104,91,255});
                  }

                  // Colosso procedural
                  Vector3 titan={0,9,-22};

                  DrawCylinder(
                      (Vector3){titan.x,titan.y-3,titan.z},
                      3.8f,5.0f,9.0f,16,
                      (Color){72,76,66,255});

                  DrawSphere(
                      (Vector3){titan.x,titan.y+3,titan.z},
                      3.1f,
                      (Color){81,84,72,255});

                  DrawCylinder(
                      (Vector3){-4.0f,5,-22},
                      1.2f,0.9f,9,12,
                      (Color){65,69,61,255});

                  DrawCylinder(
                      (Vector3){4.0f,5,-22},
                      1.2f,0.9f,9,12,
                      (Color){65,69,61,255});

                  // olhos
                  DrawSphere(
                      (Vector3){-1.1f,12,-19.3f},
                      .22f,GOLD);

                  DrawSphere(
                      (Vector3){1.1f,12,-19.3f},
                      .22f,GOLD);

                  // Player
                  DrawCapsule(
                      (Vector3){
                          player.pos.x,
                          player.pos.y,
                          player.pos.z},
                      (Vector3){
                          player.pos.x,
                          player.pos.y+1.7f,
                          player.pos.z},
                      .45f,8,8,
                      (Color){35,38,40,255});

                  // debris fisico
                  for(int i=0;i<32;i++)
                  {
                      DrawCube(
                          rocks[i].pos,
                          .6f,.6f,.6f,
                          (Color){104,101,86,255});
                  }

                  DrawGrid(40,2);

                  EndMode3D();

                  DrawRectangle(15,15,360,86,
                                Fade(BLACK,.60f));

                  DrawText(
                      "TITAN MOBILE ENGINE",
                      28,25,24,RAYWHITE);

                  DrawText(
                      "ARMv7 32-bit | raylib | GLES2",
                      28,56,18,LIGHTGRAY);

                  DrawFPS(28,78);

                  EndDrawing();
              }

              CloseWindow();
              return 0;
          }
          EOF

      - name: Download raylib
        run: |
          git clone --depth 1 \
            --branch ${RAYLIB_VERSION} \
            https://github.com/raysan5/raylib.git

      - name: Locate NDK
        run: |
          echo "NDK=$ANDROID_SDK_ROOT/ndk/27.2.12479018" \
            >> $GITHUB_ENV

      - name: Build raylib ARMv7
        run: |
          cd raylib/src

          make clean || true

          make \
            PLATFORM=PLATFORM_ANDROID \
            ANDROID_ARCH=arm \
            ANDROID_API_VERSION=${API} \
            ANDROID_NDK=${NDK} \
            GRAPHICS=GRAPHICS_API_OPENGL_ES2 \
            RAYLIB_LIBTYPE=STATIC

      - name: Compile game 32-bit
        run: |
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          CC="$TOOLCHAIN/bin/armv7a-linux-androideabi${API}-clang"

          mkdir -p apk/lib/armeabi-v7a

          "$CC" \
            game/main.c \
            -o apk/lib/armeabi-v7a/libmain.so \
            -shared \
            -fPIC \
            -O2 \
            -march=armv7-a \
            -DPLATFORM_ANDROID \
            -Iraylib/src \
            -Iraylib/src/external/glfw/include \
            -Lraylib/src \
            -lraylib \
            -landroid \
            -llog \
            -lEGL \
            -lGLESv2 \
            -lOpenSLES \
            -lm \
            -ldl \
            -u ANativeActivity_onCreate

      - name: Verify ELF 32-bit ARM
        run: |
          file apk/lib/armeabi-v7a/libmain.so

          readelf -h \
            apk/lib/armeabi-v7a/libmain.so

          file apk/lib/armeabi-v7a/libmain.so \
            | grep "ELF 32-bit"

          file apk/lib/armeabi-v7a/libmain.so \
            | grep "ARM"

      - name: Create Android project
        run: |
          mkdir -p apk/res/values
          mkdir -p apk/assets

          cat > apk/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">
                  Titan Mobile Engine
              </string>
          </resources>
          EOF

          cat > apk/AndroidManifest.xml <<'EOF'
          <manifest
            xmlns:android="http://schemas.android.com/apk/res/android">

            <uses-sdk
              android:minSdkVersion="24"
              android:targetSdkVersion="35"/>

            <uses-feature
              android:glEsVersion="0x00020000"
              android:required="true"/>

            <application
              android:label="Titan Mobile Engine"
              android:theme="@android:style/Theme.NoTitleBar.Fullscreen"
              android:hasCode="false">

              <activity
                android:name="android.app.NativeActivity"
                android:screenOrientation="landscape"
                android:configChanges=
                "orientation|keyboardHidden|screenSize"
                android:exported="true">

                <meta-data
                  android:name="android.app.lib_name"
                  android:value="main"/>

                <intent-filter>
                  <action
                    android:name=
                    "android.intent.action.MAIN"/>

                  <category
                    android:name=
                    "android.intent.category.LAUNCHER"/>
                </intent-filter>

              </activity>
            </application>
          </manifest>
          EOF

      - name: Package APK
        run: |
          BT="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}"
          PLATFORM="$ANDROID_SDK_ROOT/platforms/android-35/android.jar"

          mkdir -p out

          "$BT/aapt" package \
            -f \
            -M apk/AndroidManifest.xml \
            -S apk/res \
            -A apk/assets \
            -I "$PLATFORM" \
            -F out/Titan-unsigned.apk

          cd apk

          "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}/aapt" \
            add \
            ../out/Titan-unsigned.apk \
            lib/armeabi-v7a/libmain.so

          cd ..

      - name: Align APK
        run: |
          BT="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}"

          "$BT/zipalign" \
            -f \
            -p \
            4 \
            out/Titan-unsigned.apk \
            out/Titan-aligned.apk

      - name: Generate debug signing key
        run: |
          keytool \
            -genkeypair \
            -v \
            -keystore titan.keystore \
            -storepass android \
            -keypass android \
            -alias titan \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Titan Engine,O=Titan,C=BR"

      - name: Sign APK
        run: |
          BT="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}"

          "$BT/apksigner" sign \
            --ks titan.keystore \
            --ks-key-alias titan \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out out/TitanEngine-ARMv7.apk \
            out/Titan-aligned.apk

      - name: Verify final APK
        run: |
          BT="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}"

          "$BT/apksigner" verify \
            --verbose \
            out/TitanEngine-ARMv7.apk

          unzip -l out/TitanEngine-ARMv7.apk \
            | grep "lib/armeabi-v7a/libmain.so"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TitanEngine-Android-32bit
          path: out/TitanEngine-ARMv7.apk
          if-no-files-found: error
