name: Titan Engine Android ARMv7

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

env:
  API: "24"
  COMPILE_SDK: "35"
  BUILD_TOOLS: "35.0.0"
  NDK_VERSION: "27.2.12479018"
  RAYLIB_VERSION: "5.5"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # JAVA
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # ANDROID SDK
      #
      # packages: '' evita o erro:
      # Failed to find package 'tools'
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euxo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-${COMPILE_SDK}" \
            "build-tools;${BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}"

          NDK_PATH="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"

          test -d "$NDK_PATH"

          echo "NDK=$NDK_PATH" >> "$GITHUB_ENV"

          echo "=================================="
          echo "ANDROID SDK OK"
          echo "NDK: $NDK_PATH"
          echo "=================================="

      # ============================================================
      # VERIFY 32 BIT TOOLCHAIN
      # ============================================================

      - name: Verify ARMv7 toolchain
        shell: bash
        run: |
          set -euxo pipefail

          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          CC="$TOOLCHAIN/bin/armv7a-linux-androideabi${API}-clang"

          test -x "$CC"

          "$CC" --version

          echo "ARMv7 compiler found."

      # ============================================================
      # GENERATE GAME SOURCE
      # ============================================================

      - name: Generate Titan Engine
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p game

          cat > game/main.c <<'EOF'
          #include "raylib.h"
          #include "raymath.h"

          #include <math.h>
          #include <stdbool.h>

          typedef struct
          {
              Vector3 position;
              Vector3 velocity;

              float radius;
              float mass;

              bool grounded;

          } PhysicsBody;


          static float ClampDelta(float dt)
          {
              if (dt > 0.033333f)
                  return 0.033333f;

              return dt;
          }


          static void PhysicsStep(
              PhysicsBody *body,
              float dt
          )
          {
              const float gravity = 24.0f;

              body->velocity.y -= gravity * dt;

              body->position.x +=
                  body->velocity.x * dt;

              body->position.y +=
                  body->velocity.y * dt;

              body->position.z +=
                  body->velocity.z * dt;


              body->grounded = false;


              if (body->position.y < body->radius)
              {
                  body->position.y = body->radius;

                  if (body->velocity.y < 0.0f)
                  {
                      body->velocity.y *= -0.15f;
                  }

                  if (fabsf(body->velocity.y) < 0.6f)
                  {
                      body->velocity.y = 0.0f;
                  }

                  body->velocity.x *= 0.88f;
                  body->velocity.z *= 0.88f;

                  body->grounded = true;
              }
          }


          static void DrawRuin(
              Vector3 position,
              Vector3 size
          )
          {
              Color stone =
              {
                  103,
                  105,
                  94,
                  255
              };

              DrawCubeV(
                  position,
                  size,
                  stone
              );

              DrawCubeWiresV(
                  position,
                  size,
                  Fade(BLACK, 0.20f)
              );
          }


          static void DrawColossus(
              Vector3 p,
              float time
          )
          {
              Color stone =
              {
                  69,
                  72,
                  64,
                  255
              };

              Color darkStone =
              {
                  53,
                  57,
                  52,
                  255
              };


              float breathe =
                  sinf(time * 1.2f) * 0.20f;


              // legs

              DrawCube(
                  (Vector3)
                  {
                      p.x - 2.5f,
                      p.y + 4.0f,
                      p.z
                  },
                  2.8f,
                  8.0f,
                  3.0f,
                  darkStone
              );


              DrawCube(
                  (Vector3)
                  {
                      p.x + 2.5f,
                      p.y + 4.0f,
                      p.z
                  },
                  2.8f,
                  8.0f,
                  3.0f,
                  darkStone
              );


              // torso

              DrawSphere(
                  (Vector3)
                  {
                      p.x,
                      p.y + 11.0f + breathe,
                      p.z
                  },
                  5.2f,
                  stone
              );


              DrawCube(
                  (Vector3)
                  {
                      p.x,
                      p.y + 9.5f,
                      p.z
                  },
                  8.0f,
                  8.0f,
                  5.0f,
                  stone
              );


              // shoulders

              DrawSphere(
                  (Vector3)
                  {
                      p.x - 5.0f,
                      p.y + 11.0f,
                      p.z
                  },
                  2.0f,
                  stone
              );


              DrawSphere(
                  (Vector3)
                  {
                      p.x + 5.0f,
                      p.y + 11.0f,
                      p.z
                  },
                  2.0f,
                  stone
              );


              // arms

              DrawCube(
                  (Vector3)
                  {
                      p.x - 6.0f,
                      p.y + 6.5f,
                      p.z
                  },
                  2.5f,
                  9.0f,
                  2.5f,
                  darkStone
              );


              DrawCube(
                  (Vector3)
                  {
                      p.x + 6.0f,
                      p.y + 6.5f,
                      p.z
                  },
                  2.5f,
                  9.0f,
                  2.5f,
                  darkStone
              );


              // head

              DrawSphere(
                  (Vector3)
                  {
                      p.x,
                      p.y + 16.0f + breathe,
                      p.z
                  },
                  2.8f,
                  darkStone
              );


              // glowing eyes

              DrawSphere(
                  (Vector3)
                  {
                      p.x - 0.9f,
                      p.y + 16.3f + breathe,
                      p.z + 2.4f
                  },
                  0.20f,
                  GOLD
              );


              DrawSphere(
                  (Vector3)
                  {
                      p.x + 0.9f,
                      p.y + 16.3f + breathe,
                      p.z + 2.4f
                  },
                  0.20f,
                  GOLD
              );
          }


          int main(void)
          {
              SetConfigFlags(
                  FLAG_MSAA_4X_HINT |
                  FLAG_VSYNC_HINT
              );


              InitWindow(
                  1280,
                  720,
                  "Titan Mobile Engine"
              );


              SetTargetFPS(60);


              PhysicsBody player =
              {
                  .position =
                  {
                      0.0f,
                      0.6f,
                      12.0f
                  },

                  .velocity =
                  {
                      0.0f,
                      0.0f,
                      0.0f
                  },

                  .radius = 0.55f,
                  .mass = 80.0f,
                  .grounded = false
              };


              #define ROCK_COUNT 40

              PhysicsBody rocks[ROCK_COUNT];


              for (int i = 0; i < ROCK_COUNT; i++)
              {
                  rocks[i].position =
                  (Vector3)
                  {
                      ((float)(i % 8) - 4.0f) * 1.1f,

                      1.0f +
                      ((float)(i / 8) * 1.0f),

                      -6.0f
                  };


                  rocks[i].velocity =
                  (Vector3)
                  {
                      0.0f,
                      0.0f,
                      0.0f
                  };


                  rocks[i].radius = 0.35f;
                  rocks[i].mass = 10.0f;
                  rocks[i].grounded = false;
              }


              Camera3D camera = { 0 };


              camera.position =
              (Vector3)
              {
                  10.0f,
                  7.0f,
                  18.0f
              };


              camera.target =
              (Vector3)
              {
                  0.0f,
                  2.0f,
                  0.0f
              };


              camera.up =
              (Vector3)
              {
                  0.0f,
                  1.0f,
                  0.0f
              };


              camera.fovy = 65.0f;

              camera.projection =
                  CAMERA_PERSPECTIVE;


              float totalTime = 0.0f;


              while (!WindowShouldClose())
              {
                  float dt =
                      ClampDelta(GetFrameTime());


                  totalTime += dt;


                  // ======================================
                  // PLAYER
                  // ======================================

                  Vector3 forward =
                  {
                      camera.target.x -
                      camera.position.x,

                      0.0f,

                      camera.target.z -
                      camera.position.z
                  };


                  if (Vector3Length(forward) > 0.01f)
                  {
                      forward =
                          Vector3Normalize(forward);
                  }


                  Vector3 right =
                  {
                      -forward.z,
                      0.0f,
                      forward.x
                  };


                  Vector3 move =
                  {
                      0.0f,
                      0.0f,
                      0.0f
                  };


                  if (IsKeyDown(KEY_W))
                      move =
                          Vector3Add(
                              move,
                              forward
                          );


                  if (IsKeyDown(KEY_S))
                      move =
                          Vector3Subtract(
                              move,
                              forward
                          );


                  if (IsKeyDown(KEY_D))
                      move =
                          Vector3Add(
                              move,
                              right
                          );


                  if (IsKeyDown(KEY_A))
                      move =
                          Vector3Subtract(
                              move,
                              right
                          );


                  if (Vector3Length(move) > 0.01f)
                  {
                      move =
                          Vector3Normalize(move);


                      player.velocity.x =
                          move.x * 7.0f;


                      player.velocity.z =
                          move.z * 7.0f;
                  }
                  else
                  {
                      player.velocity.x *= 0.82f;
                      player.velocity.z *= 0.82f;
                  }


                  if (
                      IsKeyPressed(KEY_SPACE) &&
                      player.grounded
                  )
                  {
                      player.velocity.y = 9.0f;
                  }


                  PhysicsStep(
                      &player,
                      dt
                  );


                  // ======================================
                  // DEBRIS PHYSICS
                  // ======================================

                  for (
                      int i = 0;
                      i < ROCK_COUNT;
                      i++
                  )
                  {
                      PhysicsStep(
                          &rocks[i],
                          dt
                      );
                  }


                  // ======================================
                  // CAMERA
                  // ======================================

                  Vector3 target =
                  {
                      player.position.x,
                      player.position.y + 1.5f,
                      player.position.z
                  };


                  Vector3 desiredCamera =
                  {
                      player.position.x + 10.0f,
                      player.position.y + 7.0f,
                      player.position.z + 15.0f
                  };


                  camera.target =
                      Vector3Lerp(
                          camera.target,
                          target,
                          dt * 6.0f
                      );


                  camera.position =
                      Vector3Lerp(
                          camera.position,
                          desiredCamera,
                          dt * 4.0f
                      );


                  // ======================================
                  // DRAW
                  // ======================================

                  BeginDrawing();


                  ClearBackground(
                      (Color)
                      {
                          181,
                          190,
                          184,
                          255
                      }
                  );


                  BeginMode3D(camera);


                  DrawPlane(
                      (Vector3)
                      {
                          0.0f,
                          0.0f,
                          0.0f
                      },

                      (Vector2)
                      {
                          140.0f,
                          140.0f
                      },

                      (Color)
                      {
                          114,
                          119,
                          98,
                          255
                      }
                  );


                  // ======================================
                  // MONUMENTAL RUINS
                  // ======================================

                  for (int i = -6; i <= 6; i++)
                  {
                      float height =
                          4.0f +
                          ((float)((i * i) % 4));


                      DrawRuin(
                          (Vector3)
                          {
                              (float)i * 4.0f,
                              height * 0.5f,
                              -15.0f
                          },

                          (Vector3)
                          {
                              1.6f,
                              height,
                              1.6f
                          }
                      );
                  }


                  DrawRuin(
                      (Vector3)
                      {
                          -14.0f,
                          5.0f,
                          -19.0f
                      },

                      (Vector3)
                      {
                          10.0f,
                          10.0f,
                          3.0f
                      }
                  );


                  DrawRuin(
                      (Vector3)
                      {
                          15.0f,
                          3.5f,
                          -20.0f
                      },

                      (Vector3)
                      {
                          8.0f,
                          7.0f,
                          3.0f
                      }
                  );


                  // ======================================
                  // COLOSSUS
                  // ======================================

                  DrawColossus(
                      (Vector3)
                      {
                          0.0f,
                          0.0f,
                          -32.0f
                      },
                      totalTime
                  );


                  // ======================================
                  // PLAYER
                  // ======================================

                  DrawCapsule(
                      player.position,

                      (Vector3)
                      {
                          player.position.x,
                          player.position.y + 1.7f,
                          player.position.z
                      },

                      0.45f,
                      8,
                      8,

                      (Color)
                      {
                          32,
                          37,
                          38,
                          255
                      }
                  );


                  // ======================================
                  // PHYSICAL DEBRIS
                  // ======================================

                  for (
                      int i = 0;
                      i < ROCK_COUNT;
                      i++
                  )
                  {
                      DrawCube(
                          rocks[i].position,

                          0.70f,
                          0.70f,
                          0.70f,

                          (Color)
                          {
                              93,
                              94,
                              81,
                              255
                          }
                      );
                  }


                  DrawGrid(
                      50,
                      2.0f
                  );


                  EndMode3D();


                  // ======================================
                  // DEBUG HUD
                  // ======================================

                  DrawRectangle(
                      14,
                      14,
                      410,
                      118,
                      Fade(BLACK, 0.62f)
                  );


                  DrawText(
                      "TITAN MOBILE ENGINE",
                      28,
                      26,
                      24,
                      RAYWHITE
                  );


                  DrawText(
                      "ARMv7 / 32-bit / GLES2",
                      28,
                      58,
                      18,
                      LIGHTGRAY
                  );


                  DrawText(
                      "Physics: ON | Colossus: ACTIVE",
                      28,
                      82,
                      17,
                      LIGHTGRAY
                  );


                  DrawFPS(
                      28,
                      106
                  );


                  EndDrawing();
              }


              CloseWindow();

              return 0;
          }
          EOF

      # ============================================================
      # RAYLIB
      # ============================================================

      - name: Download raylib
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth 1 \
            --branch "${RAYLIB_VERSION}" \
            https://github.com/raysan5/raylib.git

      # ============================================================
      # BUILD RAYLIB ARMv7
      # ============================================================

      - name: Build raylib ARMv7
        shell: bash
        run: |
          set -euxo pipefail

          cd raylib/src

          make clean || true

          make \
            PLATFORM=PLATFORM_ANDROID \
            ANDROID_ARCH=arm \
            ANDROID_API_VERSION=${API} \
            ANDROID_NDK=${NDK} \
            GRAPHICS=GRAPHICS_API_OPENGL_ES2 \
            RAYLIB_LIBTYPE=STATIC

      # ============================================================
      # BUILD GAME
      # ============================================================

      - name: Compile Titan ARMv7
        shell: bash
        run: |
          set -euxo pipefail

          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          CC="$TOOLCHAIN/bin/armv7a-linux-androideabi${API}-clang"

          mkdir -p apk/lib/armeabi-v7a

          "$CC" \
            game/main.c \
            -shared \
            -fPIC \
            -O2 \
            -ffunction-sections \
            -fdata-sections \
            -march=armv7-a \
            -DPLATFORM_ANDROID \
            -Iraylib/src \
            -Iraylib/src/external/glfw/include \
            -Lraylib/src \
            -lraylib \
            -Wl,--gc-sections \
            -Wl,-soname,libmain.so \
            -landroid \
            -llog \
            -lEGL \
            -lGLESv2 \
            -lOpenSLES \
            -lm \
            -ldl \
            -u ANativeActivity_onCreate \
            -o apk/lib/armeabi-v7a/libmain.so

      # ============================================================
      # VERIFY 32 BIT
      # ============================================================

      - name: Verify ARM 32-bit binary
        shell: bash
        run: |
          set -euxo pipefail

          LIB="apk/lib/armeabi-v7a/libmain.so"

          file "$LIB"

          readelf -h "$LIB"

          file "$LIB" | grep "ELF 32-bit"

          file "$LIB" | grep "ARM"

          echo "================================="
          echo "32-BIT ARMv7 VERIFIED"
          echo "================================="

      # ============================================================
      # ANDROID MANIFEST
      # ============================================================

      - name: Generate Android package
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p apk/res/values
          mkdir -p apk/assets

          cat > apk/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Titan Mobile Engine</string>
          </resources>
          EOF

          cat > apk/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-sdk
                  android:minSdkVersion="24"
                  android:targetSdkVersion="35" />

              <uses-feature
                  android:glEsVersion="0x00020000"
                  android:required="true" />

              <application
                  android:label="Titan Mobile Engine"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen"
                  android:hasCode="false">

                  <activity
                      android:name="android.app.NativeActivity"
                      android:label="Titan Mobile Engine"
                      android:screenOrientation="landscape"
                      android:configChanges="orientation|keyboardHidden|screenSize"
                      android:exported="true">

                      <meta-data
                          android:name="android.app.lib_name"
                          android:value="main" />

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      # ============================================================
      # BUILD APK
      # ============================================================

      - name: Build APK
        shell: bash
        run: |
          set -euxo pipefail

          BT="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}"

          ANDROID_JAR="$ANDROID_SDK_ROOT/platforms/android-${COMPILE_SDK}/android.jar"

          mkdir -p out

          "$BT/aapt" package \
            -f \
            -M apk/AndroidManifest.xml \
            -S apk/res \
            -A apk/assets \
            -I "$ANDROID_JAR" \
            -F out/Titan-unsigned.apk

          cd apk

          "$BT/aapt" add \
            ../out/Titan-unsigned.apk \
            lib/armeabi-v7a/libmain.so

          cd ..

          unzip -l out/Titan-unsigned.apk

      # ============================================================
      # ZIPALIGN
      # ============================================================

      - name: Zipalign
        shell: bash
        run: |
          set -euxo pipefail

          BT="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}"

          "$BT/zipalign" \
            -f \
            -p \
            4 \
            out/Titan-unsigned.apk \
            out/Titan-aligned.apk

      # ============================================================
      # SIGN
      # ============================================================

      - name: Generate signing key
        shell: bash
        run: |
          set -euxo pipefail

          keytool \
            -genkeypair \
            -noprompt \
            -keystore titan.keystore \
            -storepass android \
            -keypass android \
            -alias titan \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Titan Engine,O=Titan,C=BR"

      - name: Sign APK
        shell: bash
        run: |
          set -euxo pipefail

          BT="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}"

          "$BT/apksigner" sign \
            --ks titan.keystore \
            --ks-key-alias titan \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out out/TitanEngine-ARMv7.apk \
            out/Titan-aligned.apk

      # ============================================================
      # FINAL VALIDATION
      # ============================================================

      - name: Validate APK
        shell: bash
        run: |
          set -euxo pipefail

          BT="$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}"

          "$BT/apksigner" verify \
            --verbose \
            --print-certs \
            out/TitanEngine-ARMv7.apk

          unzip -l \
            out/TitanEngine-ARMv7.apk \
            | grep "lib/armeabi-v7a/libmain.so"

          test -s \
            out/TitanEngine-ARMv7.apk

          echo ""
          echo "=================================="
          echo " TITAN APK GENERATED SUCCESSFULLY"
          echo " ARMv7 / armeabi-v7a / 32-bit"
          echo "=================================="

      # ============================================================
      # ARTIFACT
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TitanEngine-ARMv7-32bit
          path: out/TitanEngine-ARMv7.apk
          if-no-files-found: error
          retention-days: 30
